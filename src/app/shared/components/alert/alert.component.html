<app-list
  *ngIf="alerts.length > 0"
  lines="none"
  class="fixed bottom-4 left-1/2 transform -translate-x-1/2 p-4 rounded-lg w-80"
>
  <app-item
    *ngFor="let alert of alerts"
    [ngClass]="{
    'text-blue-800 bg-blue-50 dark:bg-gray-800 dark:text-blue-400': alert.type === 'Info',
    'text-red-800 bg-red-50 dark:bg-gray-800 dark:text-red-400': alert.type === 'Danger',
    'text-green-800 bg-green-50 dark:bg-gray-800 dark:text-green-400': alert.type === 'Success',
    'text-yellow-800 bg-yellow-50 dark:bg-gray-800 dark:text-yellow-300': alert.type === 'Warning',
    'bg-gray-50 dark:bg-gray-800': alert.type === 'Dark',
  }"
  >
    <ion-col size="10" class="text-left"> {{ alert.message }} </ion-col>
    <ion-col size="2" class="text-right">
      <app-image-button
        [fontIcon]="'faClose'"
        [color]="
          alert.type === 'Danger'
            ? 'danger'
            : alert.type === 'Success'
            ? 'success'
            : alert.type === 'Info'
            ? 'secondary'
            : alert.type === 'Warning'
            ? 'warning'
            : alert.type === 'Dark'
            ? 'dark'
            : 'success'
        "
        fill="clear"
        (click)="closeAlert(alert.id)"
      ></app-image-button>
    </ion-col>
  </app-item>
</app-list>

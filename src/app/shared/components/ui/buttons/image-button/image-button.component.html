<ion-button
  [disabled]="disabled"
  (click)="onClick && onClick()"
  [size]="size"
  [fill]="fill"
  [color]="color"
  [ngClass]="{
    border: border === true,
    'rounded-lg p-1 w-full': true,
  }"
  (click)="buttonClicked()"
>
  <app-image *ngIf="icon" [source]="icon"> </app-image>
  <app-icon *ngIf="ionIcon" [icon]="ionIcon"> </app-icon>
  <app-font-awesome-icon
    *ngIf="fontIcon"
    [icon]="fontIcon"
  ></app-font-awesome-icon>
  {{ label }}
</ion-button>
